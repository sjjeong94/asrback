[project]
name = "asrback"
dynamic = ["version"]
description = "OpenAI-compatible speech-to-text server for Whisper, SenseVoice, Qwen3-ASR and Gemma 4 checkpoints"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "asrfront>=0.2.2",
    "fastapi",
    "numpy",
    "openai",
    "python-multipart",
    "pyyaml>=6.0.3",
    "safetensors",
    "sentencepiece>=0.2.2",
    "tokenizers",
    "torch",
    "uvicorn[standard]",
]

[project.optional-dependencies]
# asrback-eval uses Whisper's EnglishTextNormalizer for standard WER numbers.
eval = ["openai-whisper"]

[project.scripts]
asrback = "asrback.cli:main"
asrback-client = "asrback.client:main"
asrback-eval = "asrback.evaluation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The single source of the version is asrback.__version__.
path = "src/asrback/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/asrback", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "asrback[eval]",
    "black",
    "flake8",
    "httpx>=0.28.1",
    "isort",
    "pre-commit",
    "pytest>=9.1.1",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
