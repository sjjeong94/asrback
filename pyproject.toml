[project]
name = "asrback"
version = "0.1.0"
description = "OpenAI-compatible speech-to-text server for Whisper SafeTensors checkpoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asrfront>=0.2.0",
    "fastapi",
    "numpy",
    "openai",
    "python-multipart",
    "safetensors",
    "tokenizers",
    "torch",
    "uvicorn[standard]",
]

[project.optional-dependencies]
# asrback-eval uses Whisper's EnglishTextNormalizer for standard WER numbers.
eval = ["openai-whisper"]

[project.scripts]
asrback = "asrback.cli:main"
asrback-client = "asrback.client:main"
asrback-eval = "asrback.evaluation:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asrback[eval]",
    "black",
    "flake8",
    "isort",
    "pre-commit",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
