[project]
name = "asrback"
version = "0.1.0"
description = "OpenAI-compatible speech-to-text server for Whisper SafeTensors checkpoints"
requires-python = ">=3.10"
dependencies = [
    "asrfront>=0.2.0",
    "fastapi",
    "numpy",
    "openai",
    "python-multipart",
    "safetensors",
    "tokenizers",
    "torch",
    "uvicorn",
]

[project.scripts]
asrback = "asrback.cli:main"
asrback-client = "asrback.client:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black",
    "flake8",
    "isort",
    "pre-commit",
]
# evaluate.py compares against the reference openai-whisper implementation.
eval = [
    "openai-whisper",
]

[tool.uv]
default-groups = ["dev", "eval"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
